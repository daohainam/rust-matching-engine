name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The WAL's memory-mapping behavior differs between platforms.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # Pinned so a new compiler or clippy release cannot turn `main` red
      # without a code change. Bump it deliberately, in its own commit.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --release --locked
      - run: cargo bench --no-run --locked

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Must match `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      # The promise covers the library that users depend on; dev-only
      # dependencies such as criterion may need a newer compiler.
      - run: cargo check --lib --locked

  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # Checks the unsafe ring buffer and the WAL encoding for undefined
      # behavior; tests that map files are ignored under Miri.
      - run: cargo miri test --lib --locked
