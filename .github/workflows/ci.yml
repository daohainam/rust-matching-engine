name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung test fails the job instead of running for six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest, windows-latest: the WAL's memory mapping behaves
        #   differently on Linux and Windows.
        # ubuntu-24.04-arm: ARM is weakly ordered, so the threaded ring buffer
        #   test exercises its Release/Acquire pairs for real; x86 hides most
        #   ordering bugs.
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      # Pinned so a new compiler or clippy release cannot turn `main` red
      # without a code change. Bump it deliberately, in its own commit.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # The README sends learners to `cargo doc --open`: keep links unbroken.
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --locked
      - run: cargo test --release --locked
      - run: cargo bench --no-run --locked
      # The complete program from chapter 9, section 9.7.
      - run: cargo run --release --locked --example pipeline
      # Chapter 1's worked example; its assertions pin the book after each step.
      - run: cargo run --release --locked --example walkthrough

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Must match `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      # The promise covers the library that users depend on; dev-only
      # dependencies such as criterion may need a newer compiler.
      - run: cargo check --lib --locked

  miri:
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # Checks the unsafe ring buffer and the WAL encoding for undefined
      # behavior; tests that map files are ignored under Miri.
      - run: cargo miri test --lib --locked
